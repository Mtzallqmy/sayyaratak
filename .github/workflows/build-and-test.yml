name: Build and emulator test
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Install pinned Android and Kotlin toolchains
        run: |
          bash scripts/setup-ci-android.sh "platforms;android-34" "build-tools;35.0.0" "ndk;28.2.13676358"
          curl --fail --location --retry 3 --output /tmp/kotlinc.zip https://github.com/JetBrains/kotlin/releases/download/v2.0.21/kotlin-compiler-2.0.21.zip
          unzip -q /tmp/kotlinc.zip -d "$RUNNER_TEMP"
          echo "KOTLINC=$RUNNER_TEMP/kotlinc/bin/kotlinc" >> "$GITHUB_ENV"
      - name: Build ARM64 test APK and x86_64 instrumented APK
        env:
          APK_KEYSTORE: ${{ runner.temp }}/sayyaratak-test.jks
          APK_KEY_ALIAS: ci-test
          APK_STORE_PASSWORD: ci-build-only
          APK_KEY_PASSWORD: ci-build-only
        run: |
          keytool -genkeypair -alias "$APK_KEY_ALIAS" -keyalg RSA -keysize 2048 -validity 30 \
            -keystore "$APK_KEYSTORE" -storepass:env APK_STORE_PASSWORD -keypass:env APK_KEY_PASSWORD \
            -dname "CN=Sayyaratak CI Test" -noprompt
          ./build.sh arm64-v8a
          DRIVE_INSTRUMENTATION=1 ./build.sh x86_64
          "${ANDROID_HOME}/build-tools/35.0.0/aapt2" dump badging build/arm64-v8a/Sayyaratak.apk
      - uses: actions/upload-artifact@v4
        with:
          name: apk-arm64-test
          path: build/arm64-v8a/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: apk-x86_64-emulator
          path: build/x86_64/Sayyaratak.apk
          if-no-files-found: error

  emu-test:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api-level: [26, 34]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: apk-x86_64-emulator
          path: /tmp/sayyaratak
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Install Android command-line tools
        run: bash scripts/setup-ci-android.sh
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=uaccess"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify driving offline and after context recreation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: default
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash scripts/android-smoke.sh /tmp/sayyaratak/Sayyaratak.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: drive-evidence-api-${{ matrix.api-level }}
          path: shots/
          if-no-files-found: ignore
